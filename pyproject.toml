[project]
name = "reconix-tui"
version = "0.4.0"
description = "Reconix — AI-Powered Security Testing Assistant (interactive TUI demo)"
requires-python = ">=3.9"
dependencies = [
    "textual>=8.2,<9",
    "rich>=13.7",
]

[project.scripts]
reconix = "reconix.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "reconix", "reconix.commands", "reconix.flow", "reconix.models", "reconix.screens",
    "reconix.screens.dialogs", "reconix.store", "reconix.widgets", "reconix.widgets.chat",
    "reconix.widgets.status",
]

[tool.setuptools.package-data]
reconix = ["styles/*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
